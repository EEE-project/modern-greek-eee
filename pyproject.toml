[project]
name = "modern-greek-eee"
version = "0.4.4"
description = "Greek learning tools for Marimo"
dependencies = [
    "jedi<0.20.0",
    "marimo>=0.19.4",
    "modern-greek-inflexion-eee>=2.1.10",
    "pandas>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modern_greek_eee"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
